preferences:
  general:
    units: deg

window:
  size: [1920, 1080]
  color: [0, 0, 0]
  fullscr: true
  waitBlanking: true
  screen: 0

monitor:
  name: Spinoza_7T
  width: 70.9      # width of monitor (in cm)
  distance: 196    # distance of participant from monitor (in cm)
  gamma: 1.0

mouse:
  visible: false

mri:
  simulate: false
  sync: t
  TR: 2.0
  volumes: 10
  skip: 0

deepmreye:
  # Only the bottom 70% of the projected screen is visible to the
  # participant. The experiment shrinks the calibration window's height to
  # this visible band and shifts all stimuli down so everything is in view.
  # Horizontal extent is unchanged. Set to 1.0 if the full screen is visible.
  visible_fraction: 0.7
  fixation:
    n_locs: [10, 10]
    duration: 1.5
  pursuit:
    angles_start: 0
    angles_step: 15
    amplitudes_deg: [4, 6, 8]
    duration: 1.5
  pictures:
    path: images
    n_pics: 10
    duration: 3.0
  cross_size_deg: 0.5
  cross_line_width: 3
  instruction_duration: 4
  wait_after_run: 5
